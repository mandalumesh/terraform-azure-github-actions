name: Self-Hosted Plan Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  plan-job:
    name: Run Plan Stage
    runs-on: self-hosted  # Aapke self-hosted runner par chalega

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # CASE 1: Agar Terraform use kar rahe hain (Terraform Plan)
      # ---------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      # ---------------------------------------------------------
      # CASE 2: Agar Normal Application / Custom Script hai
      # ---------------------------------------------------------
      # - name: Run Dry-Run / Plan Script
      #   run: |
      #     echo "Running plan phase..."
      #     npm run test # ya aapka build/plan command
