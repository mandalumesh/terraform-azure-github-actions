name: Terraform Dev Plan

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  terraform-plan:
    name: Dev - Terraform Validate & Plan
    runs-on: self-hosted

    defaults:
      run:
        working-directory: C:\Agent\actions-runner\_work\terraform-azure-github-actions\terraform-azure-github-actions\Enviroments\dev
        shell: powershell

    steps:

      # Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Verify Azure Login
      - name: Verify Azure Login
        shell: powershell
        run: |
          Write-Host "Checking Azure Login..."
          az account show

      # Terraform Version
      - name: Terraform Version
        run: |
          terraform version

      # Terraform Init
      - name: Terraform Init
        run: |
          terraform init

      # Terraform Validate
      - name: Terraform Validate
        run: |
          terraform validate

      # Terraform Plan
      - name: Terraform Plan
        run: |
          Write-Host "Current Directory:"
          Get-Location

          Write-Host "Running Terraform Plan..."

          terraform plan -out=tfplan

          Write-Host "Checking tfplan..."

          if (Test-Path ".\tfplan") {
              Write-Host "SUCCESS: tfplan created."
              Get-Item ".\tfplan"
          }
          else {
              Write-Error "ERROR: tfplan was not created."
              exit 1
          }

      # Upload Plan Artifact
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: Enviroments/dev/tfplan
          if-no-files-found: error
