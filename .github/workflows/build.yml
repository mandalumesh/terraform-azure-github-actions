name: Terraform DEV CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # =====================================================
  # STAGE 1 - VALIDATE + PLAN
  # =====================================================
  terraform-plan:
    name: Terraform Validate & Plan
    runs-on: self-hosted

    defaults:
      run:
        working-directory: C:\Agent\actions-runner\_work\terraform-azure-github-actions\terraform-azure-github-actions\Enviroments\dev

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: Enviroments/dev/tfplan
          if-no-files-found: error


  # =====================================================
  # STAGE 2 - APPLY
  # =====================================================
  terraform-apply:
    name: Terraform Apply
    runs-on: self-hosted

    needs: terraform-plan

    defaults:
      run:
        working-directory: C:\Agent\actions-runner\_work\terraform-azure-github-actions\terraform-azure-github-actions\Enviroments\dev
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: Enviroments/dev

      - name: Verify Terraform Plan
        shell: powershell
        run: |
          Write-Host "Current Directory:"
          Get-Location

          Write-Host "Files:"
          Get-ChildItem

          if (-not (Test-Path tfplan)) {
            Write-Error "tfplan file not found!"
            exit 1
          }

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
