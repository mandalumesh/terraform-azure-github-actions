name: Terraform Dev CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =========================================================
  # 1. TERRAFORM VALIDATE
  # =========================================================
  terraform-validate:
    name: Dev - Terraform Validate
    runs-on: self-hosted

    defaults:
      run:
        working-directory: C:\Agent\actions-runner\_work\terraform-azure-github-actions\terraform-azure-github-actions\Enviroments\dev
        shell: powershell

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure Login
        shell: powershell
        run: |
          Write-Host "Checking Azure Login..."
          az account show

      - name: Terraform Version
        run: |
          terraform version

      - name: Terraform Init
        run: |
          terraform init

      - name: Terraform Validate
        run: |
          terraform validate


  # =========================================================
  # 2. TFSEC SECURITY SCAN
  # =========================================================
  tfsec:
    name: Dev - Terraform Security Scan
    runs-on: ubuntu-latest

    needs: terraform-validate

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: Enviroments/dev
  # =========================================================
  # 3. TERRAFORM PLAN
  # =========================================================
  terraform-plan:
    name: Dev - Terraform Plan
    runs-on: self-hosted

    needs:
      - terraform-validate
      - tfsec

    defaults:
      run:
        working-directory: C:\Agent\actions-runner\_work\terraform-azure-github-actions\terraform-azure-github-actions\Enviroments\dev
        shell: powershell

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure Login
        shell: powershell
        run: |
          Write-Host "Checking Azure Login..."
          az account show

      - name: Terraform Version
        run: |
          terraform version

      - name: Terraform Init
        run: |
          terraform init

      - name: Terraform Plan
        run: |
          Write-Host "Running Terraform Plan..."

          terraform plan -out=tfplan

          Write-Host "Checking tfplan..."

          if (Test-Path ".\tfplan") {
              Write-Host "SUCCESS: tfplan created."
              Get-Item ".\tfplan"
          }
          else {
              Write-Error "ERROR: tfplan was not created."
              exit 1
          }

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: C:\Agent\actions-runner\_work\terraform-azure-github-actions\terraform-azure-github-actions\Enviroments\dev\tfplan
          if-no-files-found: error


  # =========================================================
  # 4. TERRAFORM APPLY
  # =========================================================
  terraform-apply:
    name: Dev - Terraform Apply
    runs-on: self-hosted

    needs: terraform-plan

    environment:
      name: dev

    defaults:
      run:
        working-directory: C:\Agent\actions-runner\_work\terraform-azure-github-actions\terraform-azure-github-actions\Enviroments\dev
        shell: powershell

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure Login
        shell: powershell
        run: |
          Write-Host "Checking Azure Login..."
          az account show

      - name: Terraform Version
        run: |
          terraform version

      - name: Terraform Init
        run: |
          terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-dev-plan
          path: C:\Agent\actions-runner\_work\terraform-azure-github-actions\terraform-azure-github-actions\Enviroments\dev

      - name: Verify Terraform Plan
        run: |
          Write-Host "Current Directory:"
          Get-Location

          Write-Host "Checking downloaded tfplan..."

          if (Test-Path ".\tfplan") {
              Write-Host "SUCCESS: tfplan downloaded."
              Get-Item ".\tfplan"
          }
          else {
              Write-Error "ERROR: tfplan not found."
              exit 1
          }

      - name: Terraform Apply
        run: |
          Write-Host "Applying Terraform Plan..."

          terraform apply -auto-approve tfplan

          Write-Host "Terraform Apply completed successfully."
